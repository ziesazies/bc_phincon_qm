<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pokémon List</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">
  <h1 class="text-3xl font-bold text-green-700 mb-4">Pokémon List</h1>

  <div id="pokemon-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 mb-6"></div>

  <div class="flex gap-4">
    <button id="prevBtn" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 disabled:opacity-50">Previous</button>
    <button id="nextBtn" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Next</button>
  </div>

  <script>
    const pokemonList = document.getElementById('pokemon-list');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let offset = 0;
    const limit = 8;

    async function fetchPokemonList(offset, limit) {
      const response = await fetch(`https://pokeapi.co/api/v2/pokemon?offset=${offset}&limit=${limit}`);
      const data = await response.json();
      return data.results;
    }

    async function fetchPokemonDetails(url) {
      const res = await fetch(url);
      return await res.json();
    }

    async function renderPokemon() {
      pokemonList.innerHTML = ''; // Clear previous list
      const pokemons = await fetchPokemonList(offset, limit);

      for (const pokemon of pokemons) {
        const details = await fetchPokemonDetails(pokemon.url);
        const card = document.createElement('div');
        card.className = 'bg-white rounded-lg shadow p-4 text-center';

        const img = document.createElement('img');
        img.src = details.sprites.front_default;
        img.alt = pokemon.name;
        img.className = 'mx-auto mb-2 w-20 h-20';

        const name = document.createElement('div');
        name.textContent = pokemon.name;
        name.className = 'capitalize font-semibold text-green-700';

        card.appendChild(img);
        card.appendChild(name);
        pokemonList.appendChild(card);
      }

      prevBtn.disabled = offset === 0;
    }

    prevBtn.addEventListener('click', () => {
      if (offset >= limit) {
        offset -= limit;
        renderPokemon();
      }
    });

    nextBtn.addEventListener('click', () => {
      offset += limit;
      renderPokemon();
    });

    renderPokemon(); // Initial load
  </script>
</body>
</html>
