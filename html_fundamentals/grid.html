<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Landing Page</title>
  <style>
    :root {
      --primary: #4f46e5;
      --text-dark: #1f2937;
      --text-light: #6b7280;
      --bg: #f9fafb;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text-dark);
    }

    header {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .logo {
      font-weight: bold;
      font-size: 1.5rem;
      color: var(--primary);
    }

    .nav {
      display: flex;
      gap: 1.5rem;
    }

    .nav a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 500;
    }

    .grid-hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      padding: 4rem 2rem;
      gap: 2rem;
    }

    .hero-text h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .hero-text p {
      color: var(--text-light);
      margin-bottom: 2rem;
    }

    .hero-text button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
    }

    .hero-image img {
      width: 100%;
      border-radius: 1rem;
    }

    @media (max-width: 768px) {
      .grid-hero {
        grid-template-columns: 1fr;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">MyApp</div>
    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">Features</a>
      <a href="#">Pricing</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="grid-hero">
    <div class="hero-text">
      <h1>Build Modern UIs with Ease</h1>
      <p>Learn how to use CSS Grid to create beautiful, responsive layouts for your web applications.</p>
      <button>Get Started</button>
    </div>
    <div class="hero-image">
      <img src="https://plus.unsplash.com/premium_photo-1744826574464-0fc82fc6903e?q=80&w=2874&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Hero Image">
    </div>
  </section>

</body>
</html>
