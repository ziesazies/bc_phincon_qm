<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grid vs Flexbox</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f3f4f6;
    }

    h2 {
      margin-top: 3rem;
      color: #111827;
    }

    .box {
      background: white;
      padding: 1rem;
      border-radius: 0.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      text-align: center;
      font-weight: bold;
      color: #4b5563;
    }

    /* === GRID SECTION === */
    .grid-section {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 1rem;
    }

    /* === FLEXBOX SECTION === */
    .flex-section {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
    }

    .flex-section .box {
      flex: 1 1 calc(33.33% - 1rem);
    }

    @media (max-width: 768px) {
      .grid-section {
        grid-template-columns: 1fr;
      }

      .flex-section .box {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>

  <h2>🟦 Section 1 - CSS Grid</h2>
  <div class="grid-section">
    <div class="box">Item 1</div>
    <div class="box">Item 2</div>
    <div class="box">Item 3</div>
    <div class="box">Item 4</div>
    <div class="box">Item 5</div>
    <div class="box">Item 6</div>
  </div>

  <h2>🟧 Section 2 - Flexbox</h2>
  <div class="flex-section">
    <div class="box">Item 1</div>
    <div class="box">Item 2</div>
    <div class="box">Item 3</div>
    <div class="box">Item 4</div>
    <div class="box">Item 5</div>
    <div class="box">Item 6</div>
  </div>

</body>
</html>
